<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce Store</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body>
    <header id="navbar">
        <div id="title-div">
            <h1><a>Ecommerce Store</a></h1>
        </div>
        <div id="nav-links-div">
            <div class="nav-link-div">
                <h2 class="nav-link-text"><a>About</a></h2>
            </div>
            <div class="nav-link-div">
                <h2 class="nav-link-text"><a>FAQ</a></h2>
            </div>
            <div id="user-profile-div" class="nav-link-div">
                <h2 class="nav-link-text"><a>User Profile</a></h2>
            </div>
            <div id="search-div">
                <input type="text" id="search-bar" placeholder="Search...">
                <button type="button" id="search-button"> 
                    <i class="material-icons">search</i>
                </button>
            </div>
        </div>
    </header>
    <main id="main-content">
        <div id="planets-left"> 
            
        </div>
        <div id="display"> 
            <img src="solar-system.png" alt="", width="100", height="100">
        </div>
        <div id="planets-right"> 
            
        </div>
        <script src="app.js"></script>
    </main>
    <footer>
        <p>&copy; 2025 Ecommerce Store</p>
    </footer>
</body>
</html>
