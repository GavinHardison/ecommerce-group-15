<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planet Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>

    <!-- Navbar AUTOMATICALLY INSERTED -->
    <nav id="navbar"></nav>
    <script src="app.js"></script>

    <!-- Main content -->
    <main id="main-content">
        <div class="product-grid-div">
            <div class="product-div">
                <a href="/products/kelt9b" class="product-image-link">
                    <img class="product-image" src="images/kelt9b.jpg" alt="KELT-9 b">
                </a>
                <h3 class="product-name">KELT-9 b</h3>
                <p class="product-price">$59.99</p>
                <button class="add-to-cart-button">Add to Cart</button>
            </div>
            <div class="product-div">
                <a href="/products/hr5183b" class="product-image-link">
                    <img class="product-image" src="images/hr5183b.jpg" alt="HR 5183 b">
                </a>
                <h3 class="product-name">HR 5183 b</h3>
                <p class="product-price">$54.99</p>
                <button class="add-to-cart-button">Add to Cart</button>
            </div>
            <div class="product-div">
                <a href="/products/k218b" class="product-image-link">
                    <img class="product-image" src="images/k218b.jpg" alt="K2-18 b">
                </a>
                <h3 class="product-name">K2-18 b</h3>
                <p class="product-price">$59.99</p>
                <button class="add-to-cart-button">Add to Cart</button>
            </div>
            <div class="product-div">
                <a href="/products/hatp7b" class="product-image-link">
                    <img class="product-image" src="images/hatp7b.jpg" alt="HAT-P-7 b">
                </a>
                <h3 class="product-name">HAT-P-7 b</h3>
                <p class="product-price">$49.99</p>
                <button class="add-to-cart-button">Add to Cart</button>
            </div>
            <div class="product-div">
                <a href="/products/wasp107b" class="product-image-link">
                    <img class="product-image" src="images/wasp107b.png" alt="WASP-107 b">
                </a>
                <h3 class="product-name">WASP-107 b</h3>
                <p class="product-price">$44.99</p>
                <button class="add-to-cart-button">Add to Cart</button>
            </div>
            <div class="product-div">
                <a href="/products/kepler452b" class="product-image-link">
                    <img class="product-image" src="images/kepler452b.jpg" alt="Kepler-452 b">
                </a>
                <h3 class="product-name">Kepler-452 b</h3>
                <p class="product-price">$54.99</p>
                <button class="add-to-cart-button">Add to Cart</button>
            </div>
        </div>
    </main>

    <!-- Footer by app.js -->
    <footer></footer>
</body>
</html>
