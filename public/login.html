<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planet Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>

    <!-- Navbar -->
    <nav id="navbar">
        <div id="title-div">
            <h1>Planet Shop</h1>
        </div>
        <div id="nav-links-div">
            <a href="about.html" class="nav-link-text">About</a>
            <a href="faq.html" class="nav-link-text">FAQ</a>
            <a href="#" class="nav-link-text">Contact</a>
            <a href="login.html" class="nav-link-text">Login</a>
            <a href="#" class="nav-link-text">Account</a>
        </div>
        <div id="search-div">
            <button id="cart-button">
                <i class="fa fa-shopping-cart"></i>
            </button>
            <input type="text" id="search-bar" placeholder="Search products...">
            <button id="search-button">Search</button>
        </div>
    </nav>

    <!-- Main content -->
    <main id="main-content">
        <h1 id="login-title">Login</h1>
        <form id="login-form">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <button type="submit" id="login-button">Login</button>
        </form>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            &copy; 2025 Planet Shop by Gavin, Aiden and Emily.
        </div>
    </footer>

</body>
</html>
