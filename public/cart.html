<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planet Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="cart-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>

    <!-- Navbar -->
    <nav id="navbar">
        <div id="title-div">
            <h1>Planet Shop</h1>
        </div>
        <div id="nav-links-div">
            <span class="nav-link-text">About</span>
            <span class="nav-link-text">FAQ</span>
            <span class="nav-link-text">Contact</span>
            <span class="nav-link-text">Login</span>
            <span class="nav-link-text">Account</span>
        </div>
        <div id="search-div">
            <button id="cart-button">
                <i class="fa fa-shopping-cart"></i>
            </button>
            <input type="text" id="search-bar" placeholder="Search products...">
            <button id="search-button">Search</button>
        </div>
    </nav>

    <!-- Main content -->
    <main id="main-content">
        <h1 id="cart-title">Your Cart</h1>
        <div id="cart-heading">
            <span class="cart-heading-span"></span>
            <span class="cart-heading-span">Item</span>
            <span class="cart-heading-span">Price</span>
            <span class="cart-heading-span">Quantity</span>
            <span class="cart-heading-span">Total</span>
            <span class="cart-heading-span"></span>
        </div>
        <div class="cart-item">
            <img class="cart-item-image" src="images/earth.png" alt="Earth">
            <span class="cart-item-name">Earth</span>
            <span class="cart-item-price">$29.99</span>
            <input type="number" class="cart-item-quantity" value="1" min="1">
            <span class="cart-item-total">$29.99</span>
            <button class="remove-item-button">Remove</button>
        </div>
        <div class="cart-item">
            <img class="cart-item-image" src="images/mars.png" alt="Earth">
            <span class="cart-item-name">Mars</span>
            <span class="cart-item-price">$24.99</span>
            <input type="number" class="cart-item-quantity" value="1" min="1">
            <span class="cart-item-total">$24.99</span>
            <button class="remove-item-button">Remove</button>
        </div>
        <div class="cart-item">
            <img class="cart-item-image" src="images/saturn.jpeg" alt="Earth">
            <span class="cart-item-name">Saturn</span>
            <span class="cart-item-price">$34.99</span>
            <input type="number" class="cart-item-quantity" value="1" min="1">
            <span class="cart-item-total">$34.99</span>
            <button class="remove-item-button">Remove</button>
        </div>
        <div class="cart-item">
            <img class="cart-item-image" src="images/neptune.png" alt="Earth">
            <span class="cart-item-name">Neptune</span>
            <span class="cart-item-price">$34.99</span>
            <input type="number" class="cart-item-quantity" value="1" min="1">
            <span class="cart-item-total">$34.99</span>
            <button class="remove-item-button">Remove</button>
        </div>
        <div id="cart-summary">
            <span id="total-label">Total:</span>
            <span id="total-amount">$124.96</span>
        </div>
        <button id="checkout-button">Proceed to Checkout</button>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            &copy; 2025 Planet Shop by Gavin, Aiden and Emily.
        </div>
    </footer>

</body>
</html>
